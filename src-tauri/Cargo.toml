[package]
name = "code-art"
version = "0.1.0"
description = "Code Art"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "code_art_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
window-vibrancy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
uuid = { version = "1.29.2", features = ["v4"] }
tauri-plugin-dialog = "2.8.4"
ignore = "0.4.34"
trash = "5.3.0"
notify = "8.2.2"
portable-pty = "0.9.0"
base64 = "0.23.1"
tauri-plugin-opener = "2.7.3"
unicode-normalization = "0.1.26"
libc = "0.2.191"
tauri-plugin-notification = "2"
# badge sul Dock anche senza finestre (la API di Tauri passa da una finestra)
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
